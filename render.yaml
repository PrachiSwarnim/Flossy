services:
  - type: web
    name: flossy-fastapi-backend
    env: docker
    dockerfilePath: ./flossy_backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
