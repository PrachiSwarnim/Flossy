name: Flossy CI/CD (Full Automation)

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Build & Deploy Backend to GCP
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Setup gcloud CLI
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # 3. Configure Docker for Artifact Registry
      - name: 'Configure Docker'
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      # 4. Build and Push Backend Image
      - name: 'Build and Push Container'
        run: |
          docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flossy-repo/flossy-backend:${{ github.sha }} ./flossy_backend
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flossy-repo/flossy-backend:${{ github.sha }}

      # 5. Deploy to Cloud Run
      - id: 'deploy'
        name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'flossy-backend'
          image: 'asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flossy-repo/flossy-backend:${{ github.sha }}'
          region: 'asia-south1'
          flags: '--allow-unauthenticated'

  deploy-frontend:
    name: Build & Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend # Ensure backend is ready if URL is needed
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build and Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./flossy-ui
          vercel-args: '--prod'
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
