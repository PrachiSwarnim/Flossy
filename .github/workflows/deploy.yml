name: Flossy CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- FRONTEND ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: flossy-ui
        run: |
          npm ci
          npm run build

      # ---------- BACKEND ----------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/flossy-backend:latest \
            ./flossy_backend

      - name: Push Backend Docker Image
        run: |
          docker push ghcr.io/${{ github.repository }}/flossy-backend:latest
