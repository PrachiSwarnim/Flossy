name: Flossy CI/CD (Full Automation)

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Build & Deploy Backend to GCP
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup gcloud CLI
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # 3. Configure Docker for Artifact Registry
      - name: 'Configure Docker'
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      # 4. Build and Push Backend Image
      - name: 'Build and Push Container'
        run: |
          docker build -t asia-south1-docker.pkg.dev/flossy-476616/flossy-repo/flossy-backend:${{ github.sha }} ./flossy_backend
          docker push asia-south1-docker.pkg.dev/flossy-476616/flossy-repo/flossy-backend:${{ github.sha }}

      # 5. Deploy to Cloud Run
      - id: 'deploy'
        name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'flossy-backend'
          image: 'asia-south1-docker.pkg.dev/flossy-476616/flossy-repo/flossy-backend:${{ github.sha }}'
          region: 'asia-south1'
          flags: '--allow-unauthenticated --memory=1Gi --cpu=1 --timeout=300'

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Fix npm optional dependencies issue
        run: |
          cd flossy-ui
          rm -rf node_modules package-lock.json
          npm install

      - name: Deploy to Vercel (Production)
        run: |
          cd flossy-ui
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
